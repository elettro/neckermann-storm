<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="description" content="Archivierte Neckermann Strom Instant Winner V1 Galerie.">
  <title>Instant Winner V1 | Neckermann Strom</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    .page-hero{padding:62px 0 34px;background:linear-gradient(135deg,#f9f7ed,#f3f8ef);border-bottom:1px solid rgba(2,63,44,.08)}
    .page-hero h1{margin:.15em 0;font-size:clamp(44px,6vw,82px);letter-spacing:-.05em;line-height:.95;color:#06442f}
    .page-hero p{max-width:760px;font-size:19px;line-height:1.55;color:#476057}
    .back-link{display:inline-flex;margin-top:18px;padding:11px 16px;border-radius:999px;background:#073f2e;color:#fff;text-decoration:none;font-weight:800}
    .gallery-section{padding:54px 0 72px}
    .gallery-section.alt{background:#f7f8f5}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:26px}
    .section-head h2{font-size:clamp(30px,4vw,50px);letter-spacing:-.035em;margin:0;color:#073f2e}
    .gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
    .gallery-card{margin:0;background:#fff;border-radius:18px;overflow:hidden;border:1px solid rgba(3,63,44,.1);box-shadow:0 10px 30px rgba(3,63,44,.06)}
    .image-button{display:block;width:100%;border:0;padding:0;background:#eef3ec;cursor:zoom-in}
    .gallery-card img{display:block;width:100%;height:auto;aspect-ratio:1122/1402;object-fit:contain;background:#f4f5ef}
    .gallery-card figcaption{padding:14px 16px 16px;font-weight:750;color:#123e31}
    .count{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 12px;border-radius:99px;background:#e6f3e5;color:#087b33;font-weight:900}
    .lightbox{position:fixed;inset:0;z-index:999;display:none;place-items:center;background:rgba(0,20,13,.9);padding:30px}.lightbox.open{display:grid}.lightbox img{max-width:92vw;max-height:90vh;border-radius:14px}.lightbox-close{position:fixed;top:18px;right:22px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font-size:30px;cursor:pointer}
    @media(max-width:900px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.gallery-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header"><nav class="nav shell" aria-label="Primary navigation"><a class="brand" href="../../"><img src="../../assets/neckermann-strom-logo.webp" alt="Neckermann Strom"></a><div class="nav-links"><a href="../../">Brand Hub</a><a href="../">Instant Winner</a><a href="./" aria-current="page">V1 Gallery</a></div></nav></header>
  <main>
    <section class="page-hero"><div class="shell"><strong>ARCHIVE · V1</strong><h1>Instant Winner V1</h1><p>Die früheren Instant-Winner-Konzepte wurden von der Hauptseite entfernt und hier als separates Archiv erhalten.</p><a class="back-link" href="../">Zur aktuellen Galerie</a></div></section>
    <section class="gallery-section shell"><div class="section-head"><h2>SolarMeister Giveaways</h2><span class="count">7</span></div><div class="gallery-grid" id="solar-grid"></div></section>
    <section class="gallery-section alt"><div class="shell"><div class="section-head"><h2>Instant Winner Gallery</h2><span class="count">10</span></div><div class="gallery-grid" id="general-grid"></div></div></section>
  </main>
  <footer class="footer"><div class="footer-row shell"><strong>Neckermann Strom</strong><span>V1 archive</span></div></footer>
  <div class="lightbox" id="lightbox"><button class="lightbox-close" type="button" aria-label="Schließen">×</button><img alt="Vergrößerte Kampagnenansicht"></div>
  <script>
    const images=[
      {group:'solar',label:'SolarMeister Balkonkraftwerk',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-solarmeister-balkonkraftwerk-gewinnspiel.png?v=1788466100'},
      {group:'solar',label:'800 W Balkonkraftwerk',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-solar-gewinnen-auf-dem-balkon.png?v=1788466109'},
      {group:'solar',label:'SolarMeister Solarmodul-Set',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-dein-wechsel-deine-solarmodule.png?v=1788466119'},
      {group:'solar',label:'SolarMeister Solar Gewinnspiel',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-strom-solar-gewinnspiel.png?v=1788466129'},
      {group:'solar',label:'SolarMeister Balkon Giveaway',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-solarmeister-gewinnspiel-balkon.png?v=1788466138'},
      {group:'solar',label:'SolarMeister Full-Black Solar',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-solarmeister-full-black-solar.png?v=1788467548'},
      {group:'solar',label:'SolarMeister Solar Sofortgewinn',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-solarmeister-sparen-gewinnen.png?v=1788467563'},
      {group:'general',label:'E-Bike Sofortgewinn',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-e-bike.png?v=1788467576'},
      {group:'general',label:'Smart Home Bundle',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-smart-home.png?v=1788467585'},
      {group:'general',label:'Premium Kopfhörer',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-kopfhoerer.png?v=1788467594'},
      {group:'general',label:'4K Smart-TV',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-smart-tv.png?v=1788467604'},
      {group:'general',label:'Premium Tablet',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-tablet.png?v=1788467613'},
      {group:'general',label:'Gaming-PC',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-gaming-pc.png?v=1788467624'},
      {group:'general',label:'Notebook',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-notebook.png?v=1788467633'},
      {group:'general',label:'PC-Hardware Bundle',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-pc-hardware.png?v=1788467643'},
      {group:'general',label:'Wechseln und Gewinnen',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-wechseln-und-gewinnen.png?v=1788467652'},
      {group:'general',label:'Premium Smartphone',src:'https://cdn.shopify.com/s/files/1/1004/1858/4950/files/neckermann-sofortgewinn-smartphone.png?v=1788467661'}
    ];
    const esc=s=>s.replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));
    function card(x){const f=document.createElement('figure');f.className='gallery-card';f.innerHTML=`<button class="image-button" type="button"><img loading="lazy" decoding="async" src="${x.src}" alt="${esc(x.label)}"></button><figcaption>${esc(x.label)}</figcaption>`;return f}
    const solar=document.getElementById('solar-grid'),general=document.getElementById('general-grid');images.forEach(x=>(x.group==='solar'?solar:general).appendChild(card(x)));
    const lb=document.getElementById('lightbox'),lbImg=lb.querySelector('img');document.querySelectorAll('.image-button').forEach(b=>b.addEventListener('click',()=>{lbImg.src=b.querySelector('img').src;lb.classList.add('open');document.body.style.overflow='hidden'}));function closeLB(){lb.classList.remove('open');lbImg.src='';document.body.style.overflow=''}lb.querySelector('.lightbox-close').addEventListener('click',closeLB);lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLB()});
  </script>
</body></html>
